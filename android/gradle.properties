org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# 需要指定 JDK 17 时，用环境变量 JAVA_HOME，或者在本机新建一个不提交的
# gradle.properties（或 local.properties）写：
#     org.gradle.java.home=<你的 JDK 路径>
#
# 这里不要写死绝对路径 —— 每台机器路径都不一样，写进去会泄露构建者本机的目录结构，
# 而且别人 clone 下来会直接构建失败（Gradle 报 “Java home supplied is invalid”）。
